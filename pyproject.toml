[build-system]
requires = ["maturin>=1.13,<2.0"]
build-backend = "maturin"

[project]
name = "dust-riven"
requires-python = ">=3.8"
description = "A fast, thread-safe Signal (pub-sub) primitive for Python, written in Rust."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Minh1billion", email = "[email protected]" },
]
keywords = ["signal", "pubsub", "rust", "pyo3"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/Minh1billion/dust-riven"
Repository = "https://github.com/Minh1billion/dust-riven"
Issues = "https://github.com/Minh1billion/dust-riven/issues"